# Builds the desktop apps. Run it from the Actions tab ("Run workflow") to get test builds under the
# run's "Artifacts", or push a tag like v1.0.1 to also publish a GitHub Release using RELEASE_NOTES.md.
name: Build desktop apps
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  mac:
    runs-on: macos-latest  # Apple silicon
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches app/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/version.py)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match app/version.py ($v)"; exit 1; }
      - uses: astral-sh/setup-uv@v10.3.3
      - run: ./build-mac.sh
      - name: Smoke test (the app's server answers)
        run: |
          FINANCE_DATA="$RUNNER_TEMP/data" "dist/Home Finance.app/Contents/MacOS/Home Finance" &
          for i in $(seq 1 60); do curl -sf localhost:8090/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/data/home-finance.log"; exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: Home Finance-Mac
          path: dist/HomeFinance-Mac-*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Inno Setup if missing
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: build-windows.bat
        shell: cmd
      - name: Smoke test (install silently, the app's server answers, uninstall)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\Installed App"
          $setup = Start-Process -Wait -PassThru "dist\HomeFinance-Windows-Setup.exe" -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=`"$dir`"", "/LOG=`"$env:RUNNER_TEMP\setup.log`""
          if ($setup.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "Setup failed ($($setup.ExitCode))" }
          $env:FINANCE_DATA = "$env:RUNNER_TEMP\data"
          $p = Start-Process -PassThru "$dir\Home Finance.exe"
          $up = $false
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://127.0.0.1:8090/healthz; $up = $true; break } catch { Start-Sleep 1 }
          }
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          if (-not $up) { Get-Content "$env:RUNNER_TEMP\data\home-finance.log"; throw "The installed app didn't start" }
          Start-Sleep 2
          Start-Process -Wait "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          foreach ($i in 1..30) { if (-not (Test-Path "$dir\Home Finance.exe")) { "Uninstalled"; exit 0 }; Start-Sleep 1 }
          throw "Uninstall left the app behind"
      - uses: actions/upload-artifact@v7
        with:
          name: Home Finance-Windows
          path: |
            dist/HomeFinance-Windows-Setup.exe
            dist/HomeFinance-Windows.zip

  # Manual runs only: build this version's installer and serve it as a fake "latest release" on
  # localhost, then install an "old" 0.0.1 app, let it update itself, and check the new version
  # comes back up in the same folder.
  windows-update-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Inno Setup if missing
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: build-windows.bat
        shell: cmd
      - name: Serve this build as the latest release
        shell: pwsh
        run: |
          $rel = "$env:RUNNER_TEMP\release"
          New-Item -ItemType Directory $rel | Out-Null
          Move-Item "dist\HomeFinance-Windows-Setup.exe" $rel
          $file = Get-Item "$rel\HomeFinance-Windows-Setup.exe"
          $version = (Select-String -Path app\version.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          @{ tag_name = "v$version"; body = "Test release"; html_url = "https://example.invalid/";
             assets = @(@{ name = $file.Name; browser_download_url = "http://127.0.0.1:8765/$($file.Name)"; size = $file.Length;
                           digest = "sha256:" + (Get-FileHash $file -Algorithm SHA256).Hash.ToLower() }) } |
            ConvertTo-Json -Depth 5 | Set-Content "$rel\latest.json"
          Start-Process uv -ArgumentList "run", "--no-project", "python", "-I", "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", $rel
          "EXPECTED_VERSION=$version" >> $env:GITHUB_ENV
      - name: Pretend to be version 0.0.1
        shell: pwsh
        run: (Get-Content app/version.py) -replace 'VERSION = ".*"', 'VERSION = "0.0.1"' | Set-Content app/version.py
      - run: build-windows.bat
        shell: cmd
      - name: Update to the served release
        shell: pwsh
        run: |
          $env:FINANCE_DATA = "$env:RUNNER_TEMP\upd"
          $env:HOME_FINANCE_UPDATE_API = "http://127.0.0.1:8765/latest.json"
          $install = "$env:RUNNER_TEMP\install"
          Start-Process -Wait "dist\HomeFinance-Windows-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=`"$install`""
          $exe = "$install\Home Finance.exe"
          function Wait-Health($test) {
            foreach ($i in 1..120) {
              try { $h = Invoke-RestMethod http://127.0.0.1:8090/healthz -TimeoutSec 2; if (& $test $h) { return $h } } catch {}
              Start-Sleep 1
            }
            throw "Timed out waiting for Home Finance"
          }
          try {
            # First run creates the database; then turn off the startup prompt so no dialog is open.
            $p = Start-Process -PassThru $exe
            Wait-Health { $true } | Out-Null
            Stop-Process $p -Force; Start-Sleep 2
            uv run --no-project python -c "import sqlite3,os; c=sqlite3.connect(os.path.join(os.environ['FINANCE_DATA'],'finance.db')); c.execute('INSERT OR REPLACE INTO settings (key,value) VALUES (?,?)',('update_check','0')); c.commit()"
            $p = Start-Process -PassThru $exe
            $h = Wait-Health { param($h) $h.version -eq '0.0.1' }
            "Running: $($h | ConvertTo-Json -Compress)"
            Invoke-WebRequest http://127.0.0.1:8090/update -UseBasicParsing | Out-Null   # checks for the update
            Invoke-RestMethod -Method Post http://127.0.0.1:8090/api/update/start -Headers @{ 'X-Home-Finance' = '1' }
            foreach ($i in 1..120) {
              $s = Invoke-RestMethod http://127.0.0.1:8090/api/update/status
              "$($s.phase) $([math]::Round($s.progress * 100))% $($s.error)"
              if ($s.phase -in 'restarting', 'failed') { break }
              Start-Sleep 1
            }
            if ($s.phase -ne 'restarting') { throw "Update didn't start: $($s.error)" }
            Wait-Process -Id $p.Id -Timeout 60
            $h = Wait-Health { param($h) $h.version -eq $env:EXPECTED_VERSION }
            "Updated and running again: $($h | ConvertTo-Json -Compress)"
            Get-Process 'Home Finance' | Select-Object Id, Path | Format-Table | Out-String
            if (Test-Path "$install\_internal\base_library.zip") { "App files are in place" } else { throw "App files missing after update" }
          } finally {
            Get-Content "$env:FINANCE_DATA\update.log" -ErrorAction SilentlyContinue
            Get-Process 'Home Finance' -ErrorAction SilentlyContinue | Stop-Process -Force
          }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Home Finance ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
